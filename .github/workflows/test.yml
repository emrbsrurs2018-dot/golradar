name: test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --production
      - name: cookie
        run: printf '%s' "$AISCORE" > aiscore.json
        env:
          AISCORE: ${{ secrets.AISCORE_JSON }}
      - name: test
        run: node tani.js
